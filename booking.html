
<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đặt Trải Nghiệm | Running Rice</title>

    <link rel="stylesheet" href="css/booking.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- ==========================
            Header
    =========================== -->

<header>

    <nav class="navbar">

        <a href="index.html" class="logo">

            <img
                src="images/logo.png"
                alt="Running Rice Logo"
            >

            <h2>
                Running Rice
            </h2>

        </a>

    </nav>

</header>



    <!-- ==========================
            Booking
    =========================== -->

    <section class="booking">

        <div class="booking-container">

            <!-- Left -->

            <div class="booking-image">

                <img src="images/h4.png"
                     alt="Running Rice">

            </div>



            <!-- Right -->

            <div class="booking-form">

                <h2>

                    Đặt Trải Nghiệm

                </h2>

                <p>

                    Hãy để Running Rice đồng hành cùng bạn
                    trong hành trình khám phá cuộc sống
                    miền quê Việt Nam.

                </p>



                <div class="form-group">

                    <label>

                        Họ và tên

                    </label>

                    <input
                        id="customerName"
                        type="text"
                        placeholder="Nhập họ và tên">

                </div>



                <div class="form-group">

                    <label>

                        Số điện thoại

                    </label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="Nhập số điện thoại">

                </div>



                <div class="form-group">

                    <label>

                        Email

                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="Nhập email">

                </div>






                <div class="form-group">

                    <label>

                        Chọn trải nghiệm

                    </label>

                    <select id="experience">

                        <option value="">
                            -- Chọn trải nghiệm --
                        </option>

                        <option value="Trải Nghiệm 1">
                            Trải Nghiệm 1
                        </option>

                        <option value="Trải Nghiệm 2">
                            Trải Nghiệm 2
                        </option>

                        <option value="Trải Nghiệm 3">
                            Trải nghiệm 3
                        </option>

                    </select>

                </div>



                <button
                    id="btnBook"
                    type="button">

                    Đặt Tour

                </button>

            </div>

        </div>

    </section>



    <!-- ==========================
            Footer
    =========================== -->

    <footer>

        <p
        style="
        text-align:center;
        padding:30px;
        color:#666;
        ">

            © 2026 Running Rice.
            All Rights Reserved.

        </p>

    </footer>



    <script type="module"
            src="js/app.js"></script>

</body>

</html>
```
